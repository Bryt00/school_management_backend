spring:
  application:
    name: school_mgt_api
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      header: Authorization
  version: 1.0.0
server:
  port: 8000


